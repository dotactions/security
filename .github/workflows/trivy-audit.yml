name: Trivy Security Audit

on:
  workflow_call:
    inputs:
      scan-type:
        description: "Trivy scan target type: fs, image or config"
        type: string
        default: "fs"
      severity:
        description: "Comma-separated severity levels to include"
        type: string
        default: "CRITICAL,HIGH,MEDIUM"
      fail-on-findings:
        description: "Fail the workflow if findings are detected"
        type: boolean
        default: false
      upload-artifact:
        description: "Upload the SARIF report as a job artifact"
        type: boolean
        default: true
      manage-issue:
        description: "Create, update and close a tracking issue"
        type: boolean
        default: false
      image-ref:
        description: "Image to scan (required when scan-type is image)"
        type: string
        default: ""
    outputs:
      total-findings:
        description: "Number of findings reported"
        value: ${{ jobs.trivy.outputs.total-findings }}
    secrets:
      token:
        description: "GitHub token with pull-requests and issues write permissions"
        required: false

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      total-findings: ${{ steps.report.outputs.total-findings }}
    steps:
      - name: Validate inputs
        env:
          SCAN_TYPE: ${{ inputs.scan-type }}
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          case "$SCAN_TYPE" in
            fs|image|config) ;;
            *) echo "::error::scan-type must be 'fs', 'image' or 'config', got '$SCAN_TYPE'"; exit 1 ;;
          esac
          if [ "$SCAN_TYPE" = image ] && [ -z "$IMAGE_REF" ]; then
            echo "::error::image-ref is required when scan-type is 'image'"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ inputs.scan-type }}
          image-ref: ${{ inputs.image-ref }}
          format: "sarif"
          output: "trivy.sarif"
          scanners: "vuln,secret,misconfig"
          severity: ${{ inputs.severity }}
          limit-severities-for-sarif: true

      - name: Report Trivy Results
        id: report
        uses: dotactions/sarif-reporter@917c66712f17657e67d429895eade83a9543034d # v0.1.0
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          title: "Trivy Vulnerability Report"
          sarif-file: "trivy.sarif"
          comment-tag: "trivy-audit-${{ inputs.scan-type }}"
          manage-issue: ${{ inputs.manage-issue }}
          fail-on-findings: ${{ inputs.fail-on-findings }}
          github-token: ${{ secrets.token || github.token }}

      - name: Upload SARIF Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.upload-artifact && hashFiles('trivy.sarif') != ''
        with:
          name: trivy-sarif-${{ inputs.scan-type }}
          path: "trivy.sarif"
          retention-days: 30
